<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0c" />
    <meta name="robots" content="noindex" />
    <title>Thank You — Northlume</title>
    <link rel="stylesheet" href="css/style.css" />


    <style>
      .ty-page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        text-align: center;
      }
      .ty-box {
        max-width: 480px;
        width: 100%;
      }
      .ty-box .logoheader {
        margin: 0 auto 28px;
        display: block;
      }
      .ty-box .check-big {
        width: 72px;
        height: 72px;
        line-height: 72px;
        border-radius: 50%;
        margin: 0 auto 20px;
        font-size: 36px;
        background: #1f9d55;
        color: #fff;
      }
      .ty-box h1 {
        font-size: 28px;
        margin-bottom: 12px;
      }
      .ty-box p {
        margin-bottom: 20px;
        opacity: 0.85;
      }
      .ty-box .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        text-decoration: none;
      }
      #count {
        font-weight: 700;
      }
    </style>

    <main class="ty-page">
      <div class="ty-box">
        <img src="img/logo.png" alt="Northlume logo" class="logoheader" />

        <div class="check-big">✓</div>
        <h1>Thank you for registering!</h1>
        <p>
          You're almost in. Redirecting you to the Telegram group in

        <a
          class="btn"
          id="tg-btn"
          href="https://t.me/northlume"

        >
          Join free Telegram Group
          <img
            src="img/telegramicon.png"
            alt="Telegram icon"
            class="telegram"
          />
        </a>
      </div>
    </main>
